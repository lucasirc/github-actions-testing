name: Run 5m Spaces
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  print-tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Print tests
        run: |
          echo "tests"
          echo "Data UTC: $(date -u)"
          echo "Next scheduled run should be at 09:15 UTC daily"
